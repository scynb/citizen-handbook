<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公民常用手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5c52'/%3E%3Cpath d='M9 8h14M9 14h14M9 20h9' stroke='%23f6f4ee' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f6f4ee;
    --paper-2:#efece4;
    --card:#fffdf8;
    --ink:#1c2024;
    --ink-2:#4b545e;
    --ink-3:#7b858f;
    --line:#dcd7cc;
    --line-2:#e8e3d8;
    --accent:#1f5c52;
    --accent-soft:#e8f0ee;
    --accent-2:#8a4b2f;
    --mark:#fff0c2;
    --shadow:0 2px 10px rgba(28,32,36,.05);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1200px 600px at 8% -10%, #efeadf 0%, rgba(239,234,223,0) 60%),
      linear-gradient(var(--paper), var(--paper));
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* ============ 顶部 ============ */
  .site-head{
    position:sticky;top:0;z-index:40;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .backbar{padding:12px 0 0}
  .back{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:600;letter-spacing:.3px;
    color:var(--accent);padding:5px 9px;border-radius:6px;
    transition:background .16s;
  }
  .back:hover{background:var(--accent-soft)}
  .back svg{width:12px;height:12px;stroke:var(--accent);stroke-width:2.4;fill:none}
  .head-inner{display:flex;align-items:center;gap:18px;padding-top:16px;padding-bottom:14px}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;flex:1 1 auto}
  .seal{
    width:46px;height:46px;flex:0 0 46px;border-radius:10px;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
  }
  .seal svg{width:25px;height:25px;stroke:#f6f4ee;stroke-width:2;fill:none}
  h1{font-family:"Songti SC","Source Han Serif SC","SimSun",serif;font-size:26px;letter-spacing:2px;font-weight:700;line-height:1.15}
  .sub{font-size:12.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.4px}
  .head-tools{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .searchbox{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:0 10px;height:42px;width:250px;
    transition:border-color .16s, box-shadow .16s;
  }
  .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,92,82,.1)}
  .searchbox svg{width:16px;height:16px;flex:0 0 16px;stroke:var(--ink-3);stroke-width:2;fill:none}
  #q{flex:1 1 auto;min-width:0;border:0;outline:none;background:transparent;font-size:16px;font-family:inherit;color:var(--ink)}
  #q::placeholder{color:#9aa1aa;font-size:14px}
  .menu-btn{
    width:44px;height:44px;flex:0 0 44px;border-radius:8px;
    border:1px solid var(--line);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .16s, background .16s;
  }
  .menu-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .menu-btn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.2;fill:none;transition:stroke .16s}
  .menu-btn:hover svg{stroke:var(--accent)}

  /* ============ 首页 ============ */
  .lead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
    padding:30px 0 18px;
  }
  .lead-left h2{font-family:"Songti SC","SimSun",serif;font-size:20px;letter-spacing:1px}
  .lead-left p{font-size:13px;color:var(--ink-2);margin-top:6px;max-width:640px}
  .lead-right{display:flex;gap:22px}
  .stat{text-align:right}
  .stat b{font-family:"Songti SC",serif;font-size:23px;color:var(--accent);display:block;line-height:1.2}
  .stat span{font-size:11.5px;color:var(--ink-3);letter-spacing:.5px}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:10px}
  .card{
    display:block;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 18px 16px;
    transition:border-color .16s, transform .16s, box-shadow .16s;
    position:relative;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .card-top{display:flex;align-items:baseline;gap:10px}
  .card-no{font-family:inherit;font-weight:600;font-size:11.5px;color:var(--accent);letter-spacing:1px;flex:0 0 auto}
  .card-title{font-size:16.5px;font-weight:700;letter-spacing:.3px;line-height:1.4}
  .card-sum{font-size:13px;color:var(--ink-2);margin-top:9px;line-height:1.7;min-height:44px}
  .card-foot{display:flex;align-items:center;gap:12px;margin-top:13px;padding-top:11px;border-top:1px dashed var(--line-2);font-size:11.5px;color:var(--ink-3)}
  .card-foot .go{margin-left:auto;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .card-foot .go svg{width:12px;height:12px;stroke:var(--accent);stroke-width:2.4;fill:none}

  /* ============ 首页电话条 ============ */
  .quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 20px;margin-bottom:2px}
  .quick .qt{font-size:12px;color:var(--ink-3);letter-spacing:.4px;margin-right:2px}
  .quick .tel{font-size:12px}
  .quick .more{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:4px 2px}
  .quick .more svg{width:12px;height:12px;stroke:var(--accent);stroke-width:2.2;fill:none}

  /* ============ 分类页 ============ */
  .crumb{display:flex;align-items:center;gap:8px;padding:22px 0 0;font-size:12.5px;color:var(--ink-3)}
  .crumb a{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;padding:6px 0}
  .crumb svg{width:13px;height:13px;stroke:var(--accent);stroke-width:2.4;fill:none}
  .sec-head{padding:14px 0 20px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  .sec-head .no{font-family:inherit;font-weight:600;font-size:11.5px;letter-spacing:1px;color:var(--accent)}
  .sec-head h2{font-family:"Songti SC","Source Han Serif SC",serif;font-size:27px;letter-spacing:2px;margin-top:6px;line-height:1.3}
  .sec-head p{font-size:13.5px;color:var(--ink-2);margin-top:9px;max-width:760px}

  .item{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;
  }
  .item-t{display:flex;align-items:baseline;gap:9px;font-size:16px;font-weight:700;letter-spacing:.2px;line-height:1.5}
  .item-t .n{font-family:inherit;font-weight:600;font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
  .rows{margin-top:12px;display:grid;grid-template-columns:1fr;gap:0}
  .row{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line-2)}
  .row:first-child{border-top:0}
  .lab{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.5px;line-height:1.9}
  .lab.g2{color:var(--accent-2)}
  .row p{font-size:14px;color:var(--ink-2);line-height:1.8}
  .row p strong{color:var(--ink);font-weight:600}

  .tel-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .tel{
    display:inline-flex;align-items:center;gap:5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    padding:3px 9px;border:1px solid #bcd4cf;border-radius:999px;
    background:#eef5f3;color:var(--accent);cursor:pointer;position:relative;
  }
  .tel:hover{background:#e0eeeb;border-color:var(--accent)}
  .tel svg{width:11px;height:11px;stroke:var(--accent);stroke-width:2;fill:none}
  .tel[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 7px);
    background:#1c2024;color:#fff;font-family:inherit;font-size:11.5px;
    padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:20;letter-spacing:.2px;
  }
  .laws{margin-top:9px;display:flex;flex-direction:column;gap:5px}
  .law{font-size:12.5px;color:var(--ink-2);line-height:1.7;padding-left:10px;border-left:2px solid #d8cbb8}
  .more-law{
    margin-top:10px;background:none;border:0;padding:0;cursor:pointer;
    font-size:12px;color:var(--accent);font-family:inherit;display:inline-flex;align-items:center;gap:4px;
  }
  .more-law svg{width:12px;height:12px;stroke:var(--accent);stroke-width:2;fill:none}

  /* ============ 搜索页 ============ */
  .sr-head{padding:24px 0 6px}
  .sr-head h2{font-family:"Songti SC",serif;font-size:21px;letter-spacing:1px}
  .sr-head p{font-size:13px;color:var(--ink-3);margin-top:6px}
  .sr-group{margin-top:22px}
  .sr-group .g-t{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:1px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sr-item{padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .sr-item:hover{background:#fbf9f3}
  .sr-item h4{font-size:15px;font-weight:700;letter-spacing:.2px}
  .sr-item p{font-size:13px;color:var(--ink-2);margin-top:5px}
  mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
  .empty-sr{padding:60px 0;text-align:center;color:var(--ink-3);font-size:14px}

  /* ============ 抽屉（侧边悬浮） ============ */
  .scrim{
    position:fixed;inset:0;background:rgba(22,26,30,.38);
    opacity:0;pointer-events:none;transition:opacity .22s;z-index:60;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(350px,88vw);
    background:var(--card);border-left:1px solid var(--line);
    transform:translateX(101%);transition:transform .26s cubic-bezier(.4,.0,.2,1);
    z-index:70;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(28,32,36,.1);
  }
  .drawer.on{transform:translateX(0)}
  .d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .d-head h3{font-family:"Songti SC",serif;font-size:16px;letter-spacing:1.5px}
  .x-btn{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .x-btn svg{width:14px;height:14px;stroke:var(--ink-2);stroke-width:2.2;fill:none}
  .d-list{overflow-y:auto;flex:1 1 auto;padding:8px 0 20px}
  .d-item{display:flex;align-items:baseline;gap:10px;padding:11px 18px;font-size:13.5px;transition:background .14s}
  .d-item:hover{background:var(--accent-soft)}
  .d-item .n{font-family:inherit;font-weight:600;font-size:11px;color:var(--accent);flex:0 0 20px}
  .d-item span.t{color:var(--ink);line-height:1.5}
  .d-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.7}

  /* ============ 悬浮按钮组 ============ */
  .fab{position:fixed;right:16px;bottom:18px;z-index:45;display:flex;flex-direction:column;gap:8px}
  .fab button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(28,32,36,.09);position:relative;
    transition:border-color .16s, transform .16s;
  }
  .fab button:hover{border-color:var(--accent);transform:translateY(-1px)}
  .fab button svg{width:18px;height:18px;stroke:var(--ink-2);stroke-width:2;fill:none}
  .fab button[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);
    background:#1c2024;color:#fff;font-size:11.5px;padding:5px 9px;border-radius:6px;white-space:nowrap;
  }

  /* ============ 悬浮速查卡（可拖动） ============ */
  .mini{
    position:fixed;left:16px;bottom:18px;width:238px;z-index:44;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 22px rgba(28,32,36,.13);
    display:none;
  }
  .mini.on{display:block}
  .mini-h{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line-2);cursor:move;user-select:none}
  .mini-h .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px}
  .mini-h b{font-size:12px;letter-spacing:.5px;flex:1 1 auto}
  .mini-h button{width:22px;height:22px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mini-h button svg{width:11px;height:11px;stroke:var(--ink-3);stroke-width:2.2;fill:none}
  .mini-b{padding:6px 8px 8px;display:grid;grid-template-columns:1fr;gap:2px;max-height:300px;overflow:auto}
  .mini-b a{font-size:11.5px;padding:5px 6px;border-radius:5px;color:var(--ink);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .mini-b a:hover{background:var(--accent-soft)}
  .mini-b a span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-b a i{font-style:normal;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;flex:0 0 auto}

  /* ============ 弹窗（dialog） ============ */
  dialog{
    margin:auto;
    border:0;padding:0;border-radius:12px;max-width:600px;width:calc(100% - 32px);
    box-shadow:0 18px 50px rgba(20,24,28,.25);background:var(--card);
  }
  dialog::backdrop{background:rgba(22,26,30,.45)}
  .dlg-in{padding:20px 20px 18px}
  .dlg-top{display:flex;align-items:flex-start;gap:12px}
  .dlg-top h3{font-size:16.5px;font-weight:700;line-height:1.45;flex:1 1 auto;letter-spacing:.2px}
  .dlg-close{width:32px;height:32px;flex:0 0 32px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  .dlg-close svg{width:13px;height:13px;stroke:var(--ink-2);stroke-width:2.2;fill:none}
  .dlg-body{margin-top:14px;font-size:13.5px;color:var(--ink-2);line-height:1.85;max-height:52vh;overflow:auto}
  .dlg-body h4{font-size:12.5px;color:var(--accent);letter-spacing:.6px;margin:12px 0 5px}
  .dlg-body li{margin-left:16px;margin-top:4px}
  .dlg-note{margin-top:14px;padding-top:11px;border-top:1px dashed var(--line-2);font-size:11.5px;color:var(--ink-3);line-height:1.7}

  /* ============ Toast ============ */
  .toast{
    position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);
    background:#1c2024;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:90;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ============ 页脚 ============ */
  .foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.9}
  .foot b{color:var(--ink-2)}

  /* ============ 响应式 ============ */
  @media (max-width:760px){
    .head-inner{flex-wrap:wrap;gap:12px;padding-top:13px}
    .brand{flex:1 1 100%}
    .head-tools{width:100%;order:3}
    .searchbox{flex:1 1 auto;width:auto}
    h1{font-size:22px}
    .lead{padding:20px 0 14px}
    .lead-right{gap:18px}
    .sec-head h2{font-size:23px}
    .row{grid-template-columns:1fr;gap:2px}
    .lab{line-height:1.7}
    .mini{display:none !important}
  }
  @media (min-width:760px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .rows{grid-template-columns:1fr}
  }
  @media (min-width:1000px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .row{grid-template-columns:88px 1fr}
  }
</style>
</head>
<body>

<!-- ===== 退出键：返回小y后花园 ===== -->
<div class="wrap">
  <div class="backbar">
    <a class="back" href="../" aria-label="返回小y后花园">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>返回小y后花园
    </a>
  </div>
</div>

<!-- ===== 顶部导航（含搜索 + 三横线） ===== -->
<header class="site-head">
  <div class="wrap head-inner">
    <div class="brand">
      <div class="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      </div>
      <div>
        <h1><a href="#/home">公民常用手册</a></h1>
        <p class="sub">生活场景 · 防坑要点 · 投诉电话 · 法律依据</p>
      </div>
    </div>
    <div class="head-tools">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/></svg>
        <input id="q" type="search" placeholder="搜索骗局、工资、工伤、辱骂…" autocomplete="off" aria-label="搜索手册内容">
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="打开分类目录" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app" class="wrap"></main>

<div class="wrap"><footer class="foot">
  <b>使用说明：</b>本手册为通用科普整理，条文序号以现行有效文本为准；个案可能因证据、地区细则不同而有差异，涉及具体纠纷建议咨询执业律师或拨打 12348 公共法律服务热线。<br>
  <b>免责声明：</b>本站不构成法律意见，也不代替官方渠道处理；请勿将内容用于虚假投诉、恶意索赔。
</footer></div>

<!-- ===== 悬浮层：遮罩 + 侧边抽屉 ===== -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="分类目录" aria-hidden="true">
  <div class="d-head">
    <h3>全部分类</h3>
    <button class="x-btn" id="drawerClose" aria-label="关闭目录">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="d-list" id="drawerList"></nav>
  <div class="d-foot">共 14 类场景。点击分类查看防坑、维权步骤与法律依据。</div>
</aside>

<!-- ===== 悬浮按钮组 ===== -->
<div class="fab">
  <button id="fabMenu" data-tip="分类目录" aria-label="打开分类目录">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button id="fabMini" data-tip="电话速查浮窗" aria-label="打开速查浮窗">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
  </button>
  <button id="fabTop" data-tip="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
  </button>
</div>

<!-- ===== 悬浮速查卡（可拖动） ===== -->
<div class="mini" id="mini">
  <div class="mini-h" id="miniHead">
    <span class="dot" aria-hidden="true"></span>
    <b>投诉电话速查</b>
    <button id="miniClose" aria-label="关闭速查窗">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>

<script>
/* ================= 渲染与交互 ================= */
const app = document.getElementById('app');
const qInput = document.getElementById('q');
const toastEl = document.getElementById('toast');
const dlg = document.getElementById('dlg');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('on'), 1600);
}
function copyTel(num){
  const txt = num.replace(/\s/g,'');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('已复制 '+txt)).catch(()=>toast('号码：'+txt));
  } else { toast('号码：'+txt); }
}
function telHtml(str){
  return str.split('/').map(x=>x.trim()).filter(Boolean).map(n=>
    '<span class="tel" data-tip="点击复制号码" data-copy="'+esc(n)+'">'+
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>'+
      esc(n)+'</span>'
  ).join('');
}

/* ---- 首页 ---- */
function renderHome(){
  const total = DATA.reduce((a,s)=>a+s.items.length,0);

  h += '<section class="lead"><div class="lead-left">'+
       '<h2>十四类生活场景，按需查用</h2>'+
       '<p>每一类都写明：常见套路、怎么预防、出事怎么维权、打哪个电话、依据哪条法律。点分类进入细则，也可直接用上方搜索。</p>'+
       '</div><div class="lead-right">'+
       '<div class="stat"><b>'+DATA.length+'</b><span>大类</span></div>'+
       '<div class="stat"><b>'+total+'</b><span>具体场景</span></div>'+
       '<div class="stat"><b>'+HOTLINES.length+'</b><span>维权电话</span></div>'+
       '</div></section>';

       ['12345','12315','12333','110','122','12348'].map(n=>'<span class="tel" data-tip="点击复制号码" data-copy="'+n+'">'+n+'</span>').join('')+
       '<a class="more" href="#/s/hotlines">全部渠道<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></div>';

    h += '<a class="card" href="#/s/'+s.id+'">'+
         '<div class="card-top"><span class="card-no">'+esc(s.no)+'</span>'+

         '<p class="card-sum">'+esc(s.sum)+'</p>'+

}

function renderSection(id){

    h += '<article class="item"><div class="item-t"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(it.t)+'</span></div><div class="rows">'+
         '<div class="row"><span class="lab">常见情形</span><p>'+esc(it.s)+'</p></div>'+
         '<div class="row"><span class="lab">如何预防</span><p>'+esc(it.p)+'</p></div>'+
         '<div class="row"><span class="lab g2">维权步骤</span><p>'+esc(it.w)+'</p></div>'+
         '<div class="row"><span class="lab">电话 / 法律</span><div><div class="tel-wrap">'+telHtml(it.h)+'</div>'+
         '<div class="laws">'+it.l.map(x=>'<div class="law">'+esc(x)+'</div>').join('')+'</div>'+

  setMenuState(false);

/* ---- 搜索页 ---- */
function renderSearch(q){
  q = (q||'').trim();
  if(!q){location.hash='#/home';return;}
  const kw = q.toLowerCase();
  const hit = (v)=>String(v).toLowerCase().includes(kw);
  const groups = [];
  let count = 0;
  DATA.forEach(s=>{
    s.items.forEach(it=>{
      const pool = [it.t,it.s,it.p,it.w,it.h,it.l.join(' ')].join(' ');
      if(hit(pool)){ count++; if(!groups.find(g=>g.id===s.id)) groups.push({id:s.id,title:s.title,items:[]});
        groups.find(g=>g.id===s.id).items.push(it); }
    });
  });
  const hot = HOTLINES.filter(x=>hit(x.n+' '+x.u+' '+x.d));
  if(hot.length){
    count += hot.length;
    groups.push({id:'hotlines', title:'投诉电话速查',
      items: hot.map(x=>({t:x.n+'　'+x.u, s:x.d}))});
  }
  let h = '<div class="crumb"><a href="#/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>全部分类</a><span>/</span><span>搜索结果</span></div>';
  h += '<div class="sr-head"><h2>搜索：'+esc(q)+'</h2><p>共找到 '+count+' 条相关场景</p></div>';
  if(!count){
    h += '<div class="empty-sr">没有匹配内容，换个关键词试试，例如“押金”“欠薪”“辱骂”“快递”。</div>';
  } else {
    groups.forEach(g=>{
      h += '<div class="sr-group"><div class="g-t">'+esc(g.title)+'</div>';
      g.items.forEach(it=>{
        const snippet = (it.s.length>70? it.s.slice(0,70)+'…' : it.s);
        h += '<div class="sr-item" data-sec="'+g.id+'"><h4>'+mark(it.t, q)+'</h4>'+
             '<p>'+mark(snippet, q)+'</p></div>';
      });
      h += '</div>';
    });
  }
  app.innerHTML = h;
  setMenuState(false);
  window.scrollTo({top:0});
}
function mark(text, q){
  const safe = esc(text);
  const q2 = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(q2,'ig'), m=>'<mark>'+m+'</mark>');
}

/* ---- 路由 ---- */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if(h.startsWith('s/')){ renderSection(h.slice(2)); }
  else if(h.startsWith('q/')){ const q=decodeURIComponent(h.slice(2)); qInput.value=q; renderSearch(q); }
  else { renderHome(); }
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.body.style.overflow='';
}
window.addEventListener('hashchange', route);

/* ---- 抽屉 ---- */
const drawer = document.getElementById('drawer');
const scrim = document.getElementById('scrim');
const menuBtn = document.getElementById('menuBtn');
function setMenuState(on){
  drawer.classList.toggle('on', on);
  scrim.classList.toggle('on', on);
  document.body.style.overflow = on? 'hidden':'';
  menuBtn.setAttribute('aria-expanded', on? 'true':'false');
  drawer.setAttribute('aria-hidden', on? 'false':'true');
}
function buildDrawer(){
  const list = document.getElementById('drawerList');

}
menuBtn.addEventListener('click', ()=>setMenuState(!drawer.classList.contains('on')));

scrim.addEventListener('click', ()=>setMenuState(false));
document.getElementById('fabMenu').addEventListener('click', ()=>setMenuState(true));
document.getElementById('fabTop').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ---- 搜索 ---- */
let searchTimer=null;
qInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const v=qInput.value.trim();
  searchTimer=setTimeout(()=>{
    if(!v){ if(location.hash!=='#/home') history.replaceState(null,'','#/home'); renderHome(); return; }

});

/* ---- 条文弹窗 / 复制 / 搜索结果跳转 ---- */

      '<h4>取证提示</h4><p>先固定证据再沟通；录音录像注意完整、不剪辑；书面沟通尽量用微信/短信保留时间戳；涉及人身伤害第一时间就医并留存病历。</p>';
    if(dlg.showModal) dlg.showModal(); else toast('浏览器不支持弹窗');

document.getElementById('dlgClose').addEventListener('click', ()=>dlg.close());

/* ---- 悬浮速查卡（可拖动） ---- */
const mini = document.getElementById('mini');
function buildMini(){

}
document.getElementById('fabMini').addEventListener('click', ()=>{
  mini.classList.toggle('on');
  if(mini.classList.contains('on')) toast('已打开速查浮窗');
});

document.getElementById('miniBody').addEventListener('click', e=>{
  const a=e.target.closest('[data-mini]'); if(!a) return;
  e.preventDefault(); copyTel(a.dataset.mini);
});
(function dragMini(){
  const head=document.getElementById('miniHead');
  let sx=0,sy=0,ox=0,oy=0,drag=false;
  head.addEventListener('pointerdown', e=>{
    drag=true; const r=mini.getBoundingClientRect();
    mini.style.left=r.left+'px'; mini.style.top=r.top+'px'; mini.style.bottom='auto';
    sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top; head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e=>{
    if(!drag) return;
    const w=mini.offsetWidth, hh=mini.offsetHeight;
    let nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    nx=Math.max(8,Math.min(window.innerWidth-w-8,nx));
    ny=Math.max(8,Math.min(window.innerHeight-hh-8,ny));
    mini.style.left=nx+'px'; mini.style.top=ny+'px';
  });
  head.addEventListener('pointerup', ()=>{drag=false;});
})();
