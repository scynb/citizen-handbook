<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小y后花园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5c52'/%3E%3Ctext x='16' y='23' font-size='19' font-family='Georgia,serif' font-style='italic' text-anchor='middle' fill='%23f6f4ee'%3Ey%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f6f4ee; --card:#fffdf8; --ink:#1c2024; --ink-2:#4b545e; --ink-3:#828b94;
    --line:#ddd8cd; --line-2:#eae5da; --accent:#1f5c52; --accent-soft:#e9f1ef; --gold:#8a6a3b;
    --shadow:0 3px 14px rgba(28,32,36,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
    font-size:15px;line-height:1.65;padding:0 20px 56px;
    background:
      radial-gradient(900px 460px at 12% -8%, #efe9dc 0%, rgba(239,233,220,0) 62%),
      radial-gradient(700px 420px at 92% 8%, #e9f0ed 0%, rgba(233,240,237,0) 60%),
      var(--paper);
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto}

  header{padding:64px 0 34px;text-align:center;position:relative}
  .seal{
    width:46px;height:46px;margin:0 auto 18px;border-radius:50%;
    background:var(--accent);color:#f6f4ee;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:26px;line-height:1;
    box-shadow:0 4px 14px rgba(31,92,82,.22);
  }
  h1{font-family:"Songti SC","Source Han Serif SC","SimSun",serif;font-size:40px;letter-spacing:3px;font-weight:700;line-height:1.25}
  h1 .y{font-family:Georgia,serif;font-style:italic;letter-spacing:0;color:var(--accent);margin:0 2px}
  .tagline{font-size:13px;color:var(--ink-3);letter-spacing:2px;margin-top:12px}
  .rule{width:56px;height:2px;background:var(--accent);opacity:.35;margin:22px auto 0}

  .grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:12px}
  .tile{
    display:flex;flex-direction:column;min-height:172px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px;transition:border-color .18s, transform .18s, box-shadow .18s;
    position:relative;overflow:hidden;
  }
  .tile .no{font-size:11.5px;font-weight:600;letter-spacing:1.4px;color:var(--ink-3)}
  .tile h2{font-size:17.5px;font-weight:700;letter-spacing:.5px;margin-top:10px}
  .tile p{font-size:12.5px;color:var(--ink-3);margin-top:7px;line-height:1.75}
  .tile .foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:8px;font-size:12px}
  .tile .foot .go{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600}
  .tile .foot .go svg{width:12px;height:12px;stroke:var(--accent);stroke-width:2.4;fill:none;transition:transform .18s}
  .tile .foot .state{color:var(--gold);border:1px solid #e2d5bf;background:#faf4e8;border-radius:999px;padding:2px 9px}
  .tile.on{border-color:var(--accent);background:linear-gradient(180deg,#fffefb 0%,#f2f8f6 100%)}
  .tile.on:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .tile.on:hover .foot .go svg{transform:translateX(3px)}
  .tile.on::after{
    content:"";position:absolute;right:-42px;top:-42px;width:108px;height:108px;border-radius:50%;
    background:radial-gradient(circle,rgba(31,92,82,.10),rgba(31,92,82,0) 70%);
  }
  .tile.soon{cursor:pointer;border-style:dashed;background:#fbf9f3;color:var(--ink-2)}
  .tile.soon:hover{border-color:#cfc6b6;background:#f8f5ed}
  .tile.soon h2{color:#5a6068;font-weight:600}
  .tile.on .no{color:var(--accent)}

  footer{margin-top:44px;text-align:center;font-size:11.5px;color:var(--ink-3);letter-spacing:.5px;line-height:2}
  footer b{color:var(--ink-2);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:54px;transform:translate(-50%,12px);
    background:#1c2024;color:#fff;font-size:12.5px;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:20;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (min-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);gap:18px}
  }
  @media (min-width:960px){
    header{padding:76px 0 40px}
    h1{font-size:46px}
    .grid{grid-template-columns:repeat(3,1fr);gap:20px;margin-top:16px}
    .tile{min-height:196px;padding:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal" aria-hidden="true">y</div>
    <h1>小<span class="y">y</span>后花园</h1>
    <p class="tagline">六扇门 · 一扇已开 · 其余慢慢长</p>
    <div class="rule" aria-hidden="true"></div>
  </header>

  <main class="grid">
    <a class="tile on" href="%E5%85%AC%E6%B0%91%E5%B8%B8%E7%94%A8%E6%89%8B%E5%86%9C/" aria-label="进入 公民常用手册">
      <span class="no">01</span>
      <h2>公民常用手册</h2>
      <p>生活中的坑、维权步骤、投诉电话与法律依据，按场景查。</p>
      <span class="foot"><span class="go">进入花园<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></span>
    </a>

    <div class="tile soon" data-soon="02" tabindex="0" role="button" aria-label="待位开发，敬请期待">
      <span class="no">02</span>
      <h2>待位开发</h2>
      <p>这块地还空着，正在挑种子。</p>
      <span class="foot"><span class="state">敬请期待</span></span>
    </div>

    <div class="tile soon" data-soon="03" tabindex="0" role="button" aria-label="待位开发，敬请期待">
      <span class="no">03</span>
      <h2>待位开发</h2>
      <p>留一格给以后想做的事。</p>
      <span class="foot"><span class="state">敬请期待</span></span>
    </div>

    <div class="tile soon" data-soon="04" tabindex="0" role="button" aria-label="待位开发，敬请期待">
      <span class="no">04</span>
      <h2>待位开发</h2>
      <p>土已经翻好，还差一点时间。</p>
      <span class="foot"><span class="state">敬请期待</span></span>
    </div>

    <div class="tile soon" data-soon="05" tabindex="0" role="button" aria-label="待位开发，敬请期待">
      <span class="no">05</span>
      <h2>待位开发</h2>
      <p>慢一点，也会开花。</p>
      <span class="foot"><span class="state">敬请期待</span></span>
    </div>

    <div class="tile soon" data-soon="06" tabindex="0" role="button" aria-label="待位开发，敬请期待">
      <span class="no">06</span>
      <h2>待位开发</h2>
      <p>第六扇门，留给未来的自己。</p>
      <span class="foot"><span class="state">敬请期待</span></span>
    </div>
  </main>

  <footer>
    <b>小y后花园</b>　·　一页一页，慢慢种<br>
    本站为个人小站，内容仅供参考
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  var toastEl = document.getElementById('toast'), timer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1600);
  }
  document.querySelectorAll('.soon').forEach(function(el){
    el.addEventListener('click', function(){
      toast(el.dataset.soon + ' 号地还在种，敬请期待');
    });
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toast(el.dataset.soon + ' 号地还在种，敬请期待');
      }
    });
  });
</script>
</body>
</html>
